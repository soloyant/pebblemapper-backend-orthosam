# The environment the adapter runs OrthoSAM in. CUDA 12.1 wheels; swap the
# torch index for the CPU wheel on a machine without an NVIDIA GPU.
# OrthoSAM itself is not installed: scripts/get_upstream.py clones it into
# upstream/ and run.py imports it from there.
name: pm-orthosam
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - segment-anything==1.0
      - numpy<2.4
      - opencv-python-headless
      - tifffile
      - scikit-image
      - scipy
      - pandas
      - psutil
      - tqdm
      - requests
      - matplotlib
      - pillow
      - rasterio
